name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vibebox.zip
      - .github/workflows/build-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Giải nén vibebox.zip
        run: unzip -q vibebox.zip -d _src

      - name: Dựng project Capacitor
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cd ../_src/vibebox
          cp -r index.html manifest.webmanifest sw.js css js icons ../../app/www/
          cd ../../app
          npx cap init VIBEBOX com.vibebox.studio --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK debug
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vibebox-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
